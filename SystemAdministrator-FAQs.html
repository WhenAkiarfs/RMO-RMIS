<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMO | FAQs</title>
    <link rel="stylesheet" href="css/SystemAdministrator-FAQs.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/84ccdc0b43.js" crossorigin="anonymous"></script>
</head>

<style>
    .form-control, .form-select{
        border: 1px solid #850000;
    }
</style>

<body id="body">
    <!--input fields-->
    <div class="container shadow mt-4" id="content">
        <div class="row shadow-sm display-6 p-4 mb-1" id="title">
            Add FAQ
        </div>
        <div class="row shadow p-4" id="formcont">
            <form action="">
                <div class="row">
                    <div class="col-lg-12 col-sm-12">
                        <label class="form-label" for="question">Question</label>
                        <input class="form-control mb-3" type="text" id="question" placeholder="Question">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12 col-sm-12">
                        <label class="form-label" for="answer">Answer</label>
                        <textarea name="answer" id="answer" placeholder="Answer" class="form-control"></textarea>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-lg-12 col-sm-12 d-flex justify-content-end">
                        <input type="submit" value="Add FAQ">
                    </div>   
                </div>
            </form>
        </div>
    </div>

    <div class="container display-6 mt-5 p-0">
        <div id="task">Frequently Asked Questions</div>
    </div>

    <div class="container mt-3">
         <div class="container shadow p-3" id="content">
            <div class="row align-items-center">
                <div class="lab col-10">
                    Question
                </div>
                <div class="col-2 text-end">
                    <button id="action" type="button" data-bs-toggle="collapse" data-bs-target="#collapseContent" aria-expanded="false" aria-controls="collapseContent">
                        <i class="fa-solid fa-circle-chevron-down fa-2xl" style="color: #850000;"></i>
                    </button>
                </div>
            </div>
         </div>
        <div class="collapse mt-3 bg-transparent" id="collapseContent">
          <div class="card card-body container p-3" id="content">
            <form action="">
                <div class="row">
                    <div class="col-lg-12 col-sm-12">
                        <label class="form-label" for="question">Question</label>
                        <input class="form-control mb-3" type="text" id="question" placeholder="Question">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12 col-sm-12">
                        <label class="form-label" for="answer">Answer</label>
                        <textarea name="answer" id="answer" placeholder="Answer" class="form-control"></textarea>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-lg-12 col-sm-12 d-flex justify-content-end">
                        <button id="action" class="me-2"><i class="fa-solid fa-pen-to-square fa-2xl" style="color: #850000;"></i></button>
                        <button id="action"><i class="fa-solid fa-trash fa-2xl" style="color: #850000;"></i></button>
                    </div>   
                </div>
            </form>
          </div>
        </div>
      </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
