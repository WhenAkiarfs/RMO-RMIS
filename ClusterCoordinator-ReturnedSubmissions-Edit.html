<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMO | Home</title>
    <link rel="stylesheet" href="css/ClusterCoordinator-Submissions-SubmissionEdit.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/84ccdc0b43.js" crossorigin="anonymous"></script>
</head>

<style>
    .form-control, .form-select{
        border: 1px solid #850000;
    }
</style>

<body id="body">
    <!--input fields-->

    <!--year-->
    <div class="container shadow mb-3 mt-4" id="content">
        <div class="row shadow-sm h3 p-4 mb-1" id="title">
            Year
        </div>
        <div class="row shadow p-4" id="formcont">
            <form action="">
                <div class="row">
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="fname">Year</label>
                        <select class="form-select mb-3" name="year" id="year">
                            <script src="script/ClusterCoordinator-ReturnedSubmissions-Edit-year.js"></script>
                        </select>          
                    </div>
                </div>
        </div>
    </div>
    
    <!--Colleges/Campuses/Branches/Department-->
    <div class="container shadow mb-3" id="content">
        <div class="row shadow-sm h3 p-4 mb-1" id="title">
            Colleges / Campuses / Branches / Department
        </div>
        <div class="row shadow p-4" id="formcont">
                <div class="row">
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="college">College</label>
                        <select class="form-select mb-3" aria-label="College" name="college" id="college" required>
                            <option value="CAF">College of Accountancy and Finance (CAF)</option>
                            <option value="CADBE">College of Architecture, Design and the Built Environment (CADBE)</option>
                            <option value="CAL">College of Arts and Letters (CAL)</option>
                            <option value="CBA">College of Business Administration (CBA)</option>
                            <option value="COC">College of Communication (COC)</option>
                            <option value="CCIS">College of Computer and Information Sciences (CCIS)</option>
                            <option value="COED">College of Education (COED)</option>
                            <option value="CE">College of Engineering (CE)</option>
                            <option value="CHK">College of Human Kinetics (CHK)</option>
                            <option value="CL">College of Law (CL)</option>
                            <option value="CPSPA">College of Political Science and Public Administration (CPSPA)</option>
                            <option value="CSSD">College of Social Sciences and Development (CSSD)</option>
                            <option value="CS">College of Science (CS)</option>
                            <option value="CTHTM">College of Tourism, Hospitality and Transportation Management (CTHTM)</option>
                            <option value="ITECH"> Institute of Technology (ITECH)</option>
                        </select>
                    </div>
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="department">Department</label>
                        <select id="department" class="form-select mb-3">
                            <option value="">Department</option>
                        </select>    
                    </div>
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="branches-and-campuses">Branch/Campus</label>
                        <select class="form-select mb-3" name="branches-and-campuses" id="branches-and-campuses">
                            <option value="a-mabini">A. Mabini (Campus)</option>
                            <option value="NDC-Compound">NDC Compound (Campus)</option>
                            <option value="mh-del-pilar">M.H. Del Pilar (Campus)</option>
                            <option value="Taguig-City">Taguig City (Branch)</option>
                            <option value="Quezon-City">Quezon City (Branch)</option>
                            <option value="San-Juan-City">San Juan City (Branch)</option>
                            <option value="Parañaque-City">Parañaque City (Campus)</option>\
                            <option value="Bataan">Bataan (Branch)</option>
                            <option value="Sta-Maria-Bulacan">Sta. Maria, Bulacan (Campus)</option>
                            <option value="Pulilan-Bulacan">Pulilan, Bulacan (Campus)</option>
                            <option value="Cabiao-Nueva-Ecija">Cabiao, Nueva Ecija (Campus)</option>
                            <option value="Lopez-Quezon">Lopez, Quezon (Branch)</option>
                            <option value="Mulanay-Quezon">Mulanay, Quezon (Branch)</option>
                            <option value="General-Luna-Quezon">General Luna, Quezon (Mulanay Annex)</option>
                            <option value="Unisan-Quezon">Unisan, Quezon (Branch)</option>
                            <option value="Ragay-Camarines-Sur">Ragay, Camarines Sur (Branch)</option>
                            <option value="Sto-Tomas-Batangas">Sto. Tomas, Batangas (Branch)</option>
                            <option value="Maragondon-Cavite">Maragondon, Cavite (Branch)</option>
                            <option value="Alfonso-Cavite">Alfonso, Cavite (Maragondon Annex)</option>
                            <option value="Bansud-Oriental-Mindoro">Bansud, Oriental Mindoro (Branch)</option>
                            <option value="Sablayan-Occidental-Mindoro">Sablayan, Occidental Mindoro (Branch)</option>
                            <option value="Biñan-Laguna">Biñan, Laguna (Campus)</option>
                            <option value="San-Pedro-Laguna">San Pedro, Laguna (Campus)</option>
                            <option value="Sta-Rosa-Laguna">Sta. Rosa, Laguna (Campus)</option>
                            <option value="Calauan-Laguna">Calauan, Laguna (Campus)</option>
                        </select>               
                    </div>
                </div>
        </div>
    </div>

    <!--research production-->
    <div class="container shadow mb-3" id="content">
        <div class="row shadow-sm h3 p-4 mb-1" id="title">
            Research Production
        </div>
        <div class="row shadow p-4" id="formcont">
                <div class="row">
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="research_title">Research Title</label>
                        <input class="form-control mb-3" type="text" id="research_title" placeholder="Research Title">
                    </div>
                </div>
                <div id="authors-container">
                    <div class="row author-fields">
                        <div class="col-lg-4 col-sm-12">
                            <label class="form-label" for="author_0">Author</label>
                            <input class="form-control mb-3" type="text" id="author_0" placeholder="Author">
                        </div>
                        <div class="col-lg-4 col-sm-12">
                            <label class="form-label" for="nature_of_involvement_0">Nature of Involvement</label>
                            <select name="nature_of_involvement_0" id="nature_of_involvement_0" class="form-select mb-3">
                                <option value="">Lead</option>
                                <option value="">Co-Lead</option>
                                <option value="">Member</option>
                            </select>
                        </div>
                        <div class="col-lg-4 col-sm-12 d-flex align-items-center mt-3">
                            <button type="button" class="action me-2" id="add-button"><i class="fa-solid fa-circle-plus fa-2xl" style="color: #850000;"></i></button>
                            <button type="button" class="new me-2" id="clear-button">Clear</button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="type_of_research">Type of Research</label>
                        <select name="type_of_research" id="type_of_research" class="form-select mb-3">
                            <option value="">Basic</option>
                            <option value="">Applied</option>
                        </select>
                    </div>
                </div>
                <div id="keywords-container">
                    <div class="row keyword-fields">
                        <div class="col-lg-4 col-sm-12">
                            <label class="form-label" for="keyword_0">Keyword/s</label>
                            <input class="form-control mb-3" type="text" id="keyword_0" placeholder="keyword">
                        </div>
                        <div class="col-lg-4 col-sm-12 d-flex align-items-center mt-3">
                            <button type="button" class="action me-2" id="add-keyword"><i class="fa-solid fa-circle-plus fa-2xl" style="color: #850000;"></i></button>
                            <button type="button" class="new me-2" id="clear-keywords">Clear</button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="type_of_funding">Type of Funding</label>
                        <select name="type_of_funding" id="type_of_funding" class="form-select mb-3" onchange="toggleFields()">
                            <option value="na">N/A</option>
                            <option value="self-funded">Self-Funded</option>
                            <option value="internal">Internal</option>
                            <option value="external">External</option>
                        </select>
                    </div>
                    <div class="col-lg-4 col-sm-12" id="funding_agency_field" style="display: none;">
                        <label class="form-label" for="funding_agency">Funding Agency</label>
                        <input class="form-control mb-3" type="text" id="funding_agency" placeholder="Funding Agency">
                    </div>
                    <div class="col-lg-4 col-sm-12" id="amount_of_funding_field" style="display: none;">
                        <label class="form-label" for="amount_of_funding">Amount of Funding</label>
                        <input class="form-control mb-3" type="text" id="amount_of_funding" placeholder="Amount of Funding">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-5 col-sm-5">
                        <hr>
                    </div>
                    <div class="col-lg-2 col-sm-2 text-center">
                        <h4>Duration</h4>
                    </div>
                    <div class="col-lg-5 col-sm-5">
                        <hr>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="started">Started</label>
                        <input class="form-control mb-3" type="date" id="started" placeholder="Started">
                    </div>
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="completed">Completed</label>
                        <input class="form-control mb-3" type="date" id="completed" placeholder="Completed">
                    </div>
                </div>
        </div>
    </div>

    <!--research presentation-->
    <div class="container shadow mb-3" id="content">
        <div class="row shadow-sm h3 p-4 mb-1" id="title">
            Research Presentation
        </div>
        <div class="row shadow p-4" id="formcont">
                <div class="row">
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="conference_title">Conference Title</label>
                        <input class="form-control mb-3" type="text" id="conference_title" placeholder="Conference Title">
                    </div>
                </div>
                <div id="organizer-container">
                    <div class="row organizer-fields">
                        <div class="col-lg-4 col-sm-12">
                            <label class="form-label" for="organizer_0">Organizer</label>
                            <input class="form-control mb-3" type="text" id="organizer_0" placeholder="Organizer">
                        </div>
                        <div class="col-lg-4 col-sm-12 d-flex align-items-center mt-3">
                            <button type="button" class="action me-2" id="add-organizer"><i class="fa-solid fa-circle-plus fa-2xl" style="color: #850000;"></i></button>
                            <button type="button" class="new me-2" id="clear-organizer">Clear</button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="venue">Venue</label>
                        <input class="form-control mb-3" type="text" id="venue" placeholder="Venue">
                    </div>
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="level">Level</label>
                        <select name="level" id="level" class="form-select mb-3">
                            <option value="">International</option>
                            <option value="">National</option>
                            <option value="">Regional</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-4 col-sm-5">
                        <hr>
                    </div>
                    <div class="col-lg-4 col-sm-2 text-center">
                        <h4>Date of Presentation</h4>
                    </div>
                    <div class="col-lg-4 col-sm-5">
                        <hr>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="start_date">Start Date</label>
                        <input class="form-control mb-3" type="date" id="start_date" placeholder="Start Date">
                    </div>
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="end_date">End Date</label>
                        <input class="form-control mb-3" type="date" id="end_date" placeholder="End Date">
                    </div>
                </div>
        </div>
    </div>

     <!--research publication-->
     <div class="container shadow mb-3" id="content">
        <div class="row shadow-sm h3 p-4 mb-1" id="title">
            Research Publication
        </div>
        <div class="row shadow p-4" id="formcont">
                <div class="row">
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="article_title">Article/Title</label>
                        <input class="form-control mb-3" type="text" id="article_title" placeholder="Article/Title">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="date_of_publication">Date of Publication</label>
                        <input class="form-control mb-3" type="date" id="date_of_publication" placeholder="Date of Publication">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-sm-12">
                        <label class="form-label" for="title_of_journal_publication">Title of Journal Publication</label>
                        <input class="form-control mb-3" type="text" id="title_of_journal_publication" placeholder="Title of Journal Publication">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="document_type">Document Type</label>
                        <select name="document_type" id="document_type" class="form-select mb-3">
                            <option value="">Article</option>
                            <option value="">Conference Paper</option>
                            <option value="">Book</option>
                            <option value="">Chapter</option>
                        </select>
                    </div>
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="vol_no_issue_no">Vol. No. & Issue No.</label>
                        <input class="form-control mb-3" type="text" id="vol_no_issue_no" placeholder="Vol. No. & Issue No.">
                    </div>
                    <div class="col-lg-4 col-sm-12">
                        <label class="form-label" for="ISSN_ISBN_ESSN">ISSN/ISBN/ESSN</label>
                        <input class="form-control mb-3" type="text" id="ISSN_ISBN_ESSN" placeholder="ISSN/ISBN/ESSN">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12 col-sm-12">
                        <label class="form-label" for="DOI">DOI</label>
                        <input class="form-control mb-3" type="url" id="DOI" placeholder="DOI">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12 col-sm-12">
                        <label class="form-label" for="index">Indicate Where the Journal is Index</label>
                        <input class="form-control mb-3" type="url" id="index" placeholder="Indicate Where the Journal is Index">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12 col-sm-12">
                        <label class="form-label" for="supporting_documents">Supporting Documents</label>
                        <input class="form-control mb-3" type="url" id="supporting_documents" placeholder="Supporting Documents">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12 col-sm-12">
                        <label class="form-label" for="link">Link</label>
                        <input class="form-control mb-3" type="url" id="link" placeholder="Link">
                    </div>
                </div>
        </div>
    </div>
    <div class="container mt-3 mb-3">
        <div class="d-flex justify-content-end">
            <input type="reset" value="Clear" class="ms-2" id="reset">
            <input type="button" value="Save Changes" class="ms-2" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
        </div>   
    </div>
</form>
    

   <!--save changes modal-->
   <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4" id="bgmodal">
            <div class="modal-body rounded-4 p-4">
                <h2 class="text-center mb-4" id="modaltitle">Save Changes</h2>
                <p id="content">Do you want to save the changes you made to "[Research Title]"?</p>
                <div class="mt-4 d-flex justify-content-center align-items-center">
                    <button type="button" class="me-2" data-bs-dismiss="modal" id="modalbtn">Close</button>
                    <a href="ClusterCoordinator-ReturnedSubmissions-List.html"><button type="button" class="me-2" data-bs-dismiss="modal" id="modalbtn">Save Changes</button></a>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="script/ClusterCoordinator-ReturnedSubmissions-Edit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>

</html>
