<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMO | Home</title>
    <link rel="stylesheet" href="css/ClusterCoordinator-ToReview-List.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/84ccdc0b43.js" crossorigin="anonymous"></script>
</head>

<style>
    .form-control, .form-select{
        border: 1px solid #850000;
    }
</style>

<body id="body">
    <div class="container display-6 mt-4 p-0">
        <div id="task">To Review</div>
    </div>

    <!--search and filter-->
    <div class="container mt-3">
        <div class="row justify-content-between">
            <!--search-->
            <div class="col-lg-3 col-sm-12 mb-2">
                <form action="" class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search">
                    <button type="submit" id="action"><i class="fa-solid fa-magnifying-glass fa-2xl" style="color: #850000;"></i></button>
                </form>
            </div>
            <!--filter-->
            <div class="col-lg-3 col-sm-12 mb-2">
                <form action="" class="d-flex">
                    <select id="filterSelect" class="form-select me-2">
                        <option>Title (A-Z)</option>
                        <option>Title (Z-A)</option>
                        <option>Authors (A-Z)</option>
                        <option>Authors (Z-A)</option>
                        <option>College (A-Z)</option>
                        <option>College (Z-A)</option>
                        <option>Campus/Branch (A-Z)</option>
                        <option>Campus/Branch (Z-A)</option>
                        <option>Department (A-Z)</option>
                        <option>Department (Z-A)</option>
                        <option>Year (Earliest to Latest)</option>
                        <option>Year (Latest to Earliest)</option>
                        <option>Started (Earliest to Latest)</option>
                        <option>Started (Latest to Earliest)</option>
                        <option>Completed (Earliest to Latest)</option>
                        <option>Completed (Latest to Earliest)</option>
                    </select>
                    <button type="submit" id="action"><i class="fa-solid fa-filter fa-2xl" style="color: #850000;"></i></button>
                </form>
            </div>
        </div> 
    </div>

    <!--table-->
    <div class="container bg-white shadow mt-1 table-responsive rounded-4 p-0">
        <table class="table w-100">
            <thead class="shadow-sm">
                <tr class="align-middle">
                    <th class="p-4 bg-transparent" scope="row">Research Title</th>
                    <th class="p-4 bg-transparent" scope="col">Authors</th>
                    <th class="p-4 bg-transparent" scope="col">College</th>
                    <th class="p-4 bg-transparent" scope="col">Campus/Branch</th>
                    <th class="p-4 bg-transparent" scope="col">Department</th>
                    <th class="p-4 bg-transparent" scope="col">Year</th>
                    <th class="p-4 bg-transparent" scope="col">Started</th>
                    <th class="p-4 bg-transparent" scope="col">Completed</th>
                    <th class="p-4 bg-transparent" scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr class="align-middle">
                    <td class="p-4 bg-transparent" scope="row">Research Title</td>
                    <td class="p-4 bg-transparent" scope="col">Author Name | User Type</td>
                    <td class="p-4 bg-transparent" scope="col">College</td>
                    <td class="p-4 bg-transparent" scope="col">Campus/Branch</td>
                    <td class="p-4 bg-transparent" scope="col">Department</td>
                    <td class="p-4 bg-transparent" scope="col">Year</td>
                    <td class="p-4 bg-transparent" scope="col">Started</td>
                    <td class="p-4 bg-transparent" scope="col">Completed</td>
                    <td class="p-4 bg-transparent" scope="col">
                        <button id="action" class="me-2"><a href="ClusterCoordinator-ToReview-Details.html"><i class="fa-solid fa-eye fa-2xl" style="color: #850000;"></i></a></button>
                        <button id="action" class="me-2"><i class="fa-solid fa-check fa-2xl" style="color: #850000;"></i></button>
                        <button id="action"><i class="fa-solid fa-xmark fa-2xl" style="color: #850000;"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
